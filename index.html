<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ServiceIO Quiz</title>
<style>
:root{--blue:#084788;--dk:#06345f;--mint:#e8f0f9;--bg:#f4f7fb;--ink:#14263a;--mut:#5d6f82;--line:#cbd7e6;--ok:#1f9d55;--bad:#c0392b}
*{box-sizing:border-box}
body,button,input{font-family:Tahoma,Geneva,Verdana,sans-serif}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4;min-height:100vh}
header{background:#fff;border-bottom:3px solid var(--blue);padding:8px 20px;display:flex;align-items:center}
header img{height:44px;display:block}header span{margin-left:auto;color:var(--mut);font-size:13px}
main{max-width:520px;margin:16px auto;padding:0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px}
h1{font-size:21px;margin:0 0 2px;color:var(--dk)}p.s{color:var(--mut);margin:0 0 10px;font-size:13px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:block;font-weight:bold;margin:10px 0 4px;font-size:13px}label.f small{font-weight:normal;color:var(--mut)}
input[type=text],input[type=tel],input[type=email]{width:100%;padding:9px 10px;border:1.5px solid var(--line);border-radius:6px;font-size:14px}
input:focus{outline:2px solid #9cc2ee;border-color:var(--blue)}
.opt{display:flex;gap:8px;align-items:center;padding:9px 10px;border:1.5px solid var(--line);border-radius:6px;cursor:pointer;background:#fff;width:100%;text-align:left;font-size:13px;color:inherit;line-height:1.25}
.opt:hover{border-color:var(--blue)}.opt.on,.opt:has(input:checked){border-color:var(--blue);background:var(--mint)}
.opt input{width:16px;height:16px;accent-color:var(--blue);margin:0;flex:none}
.q .opt{margin:6px 0;font-size:14px;padding:10px 12px}.q .opt em{font-style:normal;font-weight:bold;color:var(--blue);min-width:18px}
button.go{margin-top:14px;background:var(--blue);color:#fff;border:0;border-radius:6px;padding:11px 20px;font-size:15px;font-weight:bold;cursor:pointer;width:100%}
button.go:hover{background:var(--dk)}button.go:disabled{background:#9db2c8;cursor:not-allowed}
button.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}button.ghost:hover{background:var(--mint)}
.err{color:var(--bad);margin-top:8px;font-weight:bold;font-size:13px;min-height:16px}
.bar{height:6px;background:var(--mint);border-radius:3px;margin-bottom:12px;overflow:hidden}.bar div{height:100%;background:var(--blue);transition:width .3s}
.qt{font-size:17px;font-weight:bold;color:var(--dk);margin:0 0 8px}
.big{font-size:48px;font-weight:bold;color:var(--dk);margin:0}
.win{background:var(--blue);color:#fff;border-radius:10px;padding:16px;margin:12px 0}.win h2{margin:0 0 4px;font-size:21px}
.note{background:var(--mint);border-radius:8px;padding:12px;margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid var(--line);padding:5px 7px;text-align:left}th{background:var(--mint)}
.wrap{overflow-x:auto;max-height:50vh}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1;min-width:130px;margin-top:8px}
</style></head><body>

var CATS = ["From ServiceNow","From ServiceNow Partner Network","ServiceNow Customer","Exploring ServiceNow as Customer"];
var FINAL_CATS = [2,3], PASS_SCORE = 3, KEY = "serviceio_quiz_entries_v1", mem = [];
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return mem}}
function save(a){mem=a;try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
var app=document.getElementById("app");
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function pick(){
  var levels=["Easy","Medium","Hard"],best=null;
  for(var t=0;t<40;t++){
    var set=[],topics={};
    levels.forEach(function(l){
      var pool=QS.filter(function(q){return q.d===l});if(!pool.length)pool=QS;
      var c=shuffle(pool).find(function(q){return !topics[q.t]})||shuffle(pool)[0];topics[c.t]=1;set.push(c)});
    if(new Set(set.map(function(q){return q.t})).size===3){best=set;break}best=best||set;
  }
  return best.map(function(q){var idx=shuffle([0,1,2,3]);
    return {q:q.q,opts:idx.map(function(i){return q.o[i]}),ans:idx.indexOf(q.a)}});
}

/* ---- shared storage (Google Sheet) with local backup ---- */
function send(rec){
  if(!SHEET_URL)return Promise.resolve(false);
  return fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(rec)})
    .then(function(){return true}).catch(function(){return false});
}
function syncAll(){
  var a=load(),p=a.filter(function(r){return !r.synced});
  return p.reduce(function(chain,r){return chain.then(function(){return send(r).then(function(ok){if(ok)r.synced=true})})},Promise.resolve())
    .then(function(){save(a);return p.length});
}
function existsRemote(d){
  if(!SHEET_URL)return Promise.resolve(false);
  var c=new AbortController(),t=setTimeout(function(){c.abort()},4000);
  return fetch(SHEET_URL+"?check="+d,{signal:c.signal}).then(function(r){return r.json()}).then(function(j){clearTimeout(t);return !!j.exists}).catch(function(){return false});
}

var state={};
function reg(msg){
  state={};
  app.innerHTML='<div class="card"><h1>Play &amp; win</h1><p class="s">Answer 3 quick questions. Score 3/3 for a shot at the final round.</p>'+
  '<div class="g2"><div><label class="f" for="n">Full name</label><input id="n" type="text" autocomplete="off"></div>'+
  '<div><label class="f" for="c">Contact number</label><input id="c" type="tel" autocomplete="off"></div></div>'+
  '<label class="f" for="e">Email <small>(optional)</small></label><input id="e" type="email" autocomplete="off">'+
  '<label class="f">I am</label><div class="g2">'+CATS.map(function(c,i){return '<label class="opt"><input type="radio" name="cat" value="'+i+'"><span>'+c+'</span></label>'}).join("")+'</div>'+
  '<div class="err" id="er">'+(msg||"")+'</div><button class="go" id="st">Start quiz</button></div>';
  var btn=document.getElementById("st");
  btn.onclick=function(){
    var n=document.getElementById("n").value.trim(),c=document.getElementById("c").value.trim(),
        e=document.getElementById("e").value.trim(),r=document.querySelector('input[name=cat]:checked'),er=document.getElementById("er");
    var d=c.replace(/\D/g,"");
    if(!n)return er.textContent="Please enter your name.";
    if(d.length<10)return er.textContent="Please enter a valid contact number (10 digits).";
    if(e&&!/^\S+@\S+\.\S+$/.test(e))return er.textContent="That email doesn't look right. Fix it or leave it blank.";
    if(!r)return er.textContent="Please choose one of the four options.";
    var dup="This number has already played. One try per person, thank you!";
    if(load().some(function(x){return x.digits===d}))return er.textContent=dup;
    btn.disabled=true;btn.textContent="Checking...";
    existsRemote(d).then(function(ex){
      if(ex){btn.disabled=false;btn.textContent="Start quiz";return er.textContent=dup}
      state={name:n,contact:c,digits:d,email:e,cat:+r.value,qs:pick(),i:0,ans:[]};ask();
    });
  };
}
function ask(){
  var s=state,q=s.qs[s.i],sel=null;
  app.innerHTML='<div class="card q"><div class="bar"><div style="width:'+(s.i/3*100)+'%"></div></div>'+
  '<p class="s">Question '+(s.i+1)+' of 3</p><p class="qt">'+esc(q.q)+'</p>'+
  q.opts.map(function(o,i){return '<button class="opt" data-i="'+i+'"><em>'+"ABCD"[i]+'</em><span>'+esc(o)+'</span></button>'}).join("")+
  '<button class="go" id="nx" disabled>'+(s.i<2?"Next question":"See my result")+'</button></div>';
  var b=app.querySelectorAll(".opt");
  b.forEach(function(x){x.onclick=function(){b.forEach(function(y){y.classList.remove("on")});x.classList.add("on");sel=+x.dataset.i;document.getElementById("nx").disabled=false}});
  document.getElementById("nx").onclick=function(){s.ans.push(sel);s.i++;s.i<3?ask():finish()};
}
function finish(){
  var s=state,score=0;s.qs.forEach(function(q,i){if(s.ans[i]===q.ans)score++});
  var eligible=score>=PASS_SCORE&&FINAL_CATS.indexOf(s.cat)>-1;
  var rec={id:Date.now()+"-"+s.digits,time:new Date().toLocaleString(),name:s.name,contact:s.contact,digits:s.digits,email:s.email,cat:CATS[s.cat],score:score,eligible:eligible?"Yes":"No",
    qa:s.qs.map(function(q,i){return {q:q.q,given:q.opts[s.ans[i]],correct:q.opts[q.ans],ok:s.ans[i]===q.ans?"Yes":"No"}}),synced:false};
  var a=load();a.push(rec);save(a);
  send(rec).then(function(ok){if(ok){rec.synced=true;save(a)}});
  var fn=esc(s.name.split(" ")[0]),h='<div class="card" style="text-align:center"><p class="s">Your score</p><p class="big">'+score+' / 3</p>';
  if(eligible)h+='<div class="win"><h2>You are in the final round!</h2>Please show this screen to our team at the booth.</div>';
  else if(score===3)h+='<div class="note"><b>Perfect score!</b> Thanks for playing, '+fn+'. Our team will be happy to talk with you.</div>';
  else h+='<div class="note">Good try, '+fn+'! Thanks for playing. Drop by again to chat with our team.</div>';
  app.innerHTML=h+'<button class="go" id="nx">Next participant</button></div>';
  document.getElementById("nx").onclick=function(){reg()};
}

function csvCell(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCsv(){
  var a=load(),h=["Timestamp","Name","Contact","Email","Category","Score","Final Round Eligible"];
  for(var i=1;i<=3;i++)h.push("Q"+i+" Question","Q"+i+" Answer Given","Q"+i+" Correct Answer","Q"+i+" Right?");
  var rows=[h].concat(a.map(function(r){var x=[r.time,r.name,r.contact,r.email,r.cat,r.score,r.eligible];r.qa.forEach(function(q){x.push(q.q,q.given,q.correct,q.ok)});return x}));
  var u=URL.createObjectURL(new Blob(["\ufeff"+rows.map(function(r){return r.map(csvCell).join(",")}).join("\r\n")],{type:"text/csv;charset=utf-8"}));
  var l=document.createElement("a");l.href=u;l.download="ServiceIO_Quiz_This_Device_"+new Date().toISOString().slice(0,10)+".csv";document.body.appendChild(l);l.click();l.remove();
}
function admin(msg){
  var a=load(),el=a.filter(function(r){return r.eligible==="Yes"}).length,un=a.filter(function(r){return !r.synced}).length;
  app.innerHTML='<div class="card"><h1>Admin</h1><p class="s">This device: '+a.length+' participants, '+el+' eligible for the final round.<br>'+
  (SHEET_URL?(un?'<b style="color:#c0392b">'+un+' not yet sent to the shared sheet.</b> Tap Sync now.':'All entries are in the shared Google Sheet.'):'No shared sheet connected. Data is only on this device.')+(msg?'<br><b>'+msg+'</b>':'')+'</p>'+
  '<div class="row"><button class="go ghost" id="bk">Back to quiz</button>'+(SHEET_URL?'<button class="go" id="sy">Sync now</button>':'')+'<button class="go" id="ex">Download CSV</button><button class="go ghost" id="cl">Clear this device</button></div>'+
  '<div class="wrap" style="margin-top:12px"><table><tr><th>Name</th><th>Contact</th><th>Category</th><th>Score</th><th>Final</th><th>Sent</th></tr>'+
  a.slice().reverse().map(function(r){return '<tr><td>'+esc(r.name)+'</td><td>'+esc(r.contact)+'</td><td>'+esc(r.cat)+'</td><td>'+r.score+'/3</td><td>'+r.eligible+'</td><td>'+(r.synced?"Yes":"No")+'</td></tr>'}).join("")+'</table></div></div>';
  document.getElementById("bk").onclick=function(){location.hash="";reg()};
  document.getElementById("ex").onclick=exportCsv;
  var sy=document.getElementById("sy");if(sy)sy.onclick=function(){sy.disabled=true;sy.textContent="Syncing...";syncAll().then(function(n){admin(n+" entries sent.")})};
  document.getElementById("cl").onclick=function(){if(un&&!confirm(un+" entries are NOT in the shared sheet yet. Delete anyway?"))return;if(confirm("Delete all data on THIS device?")){save([]);admin()}};
}
function route(){location.hash==="#admin"?admin():reg()}
window.onhashchange=route;route();syncAll();
</script></body></html>
